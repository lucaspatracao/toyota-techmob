spring.application.name=backend

# Conexão local do MySQL (Workbench)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:techmob}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# SQL no console só quando pedido (SHOW_SQL=true); evita poluir o log.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# O dialeto (MySQL aqui, H2 nos testes) é detectado pela conexão.

# Actuator/Health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Porta do Servidor
server.port=8080

# ---------------------------------------------------------------------
# Coleta da Bancada Smart 4.0 (somente leitura: o backend só faz GET /dadosPlanta)
# ---------------------------------------------------------------------
# false desliga a leitura da bancada (os testes rodam assim)
techmob.coleta.habilitada=${COLETA_HABILITADA:true}
techmob.planta.maquina-id=${MAQUINA_ID:1}
# Node-RED da bancada; depois de 3 falhas seguidas o backend lê o simulador (fallback)
techmob.planta.url=${PLANTA_URL:http://localhost:1880/dadosPlanta}
techmob.planta.url-fallback=${PLANTA_URL_FALLBACK:http://localhost:1881/dadosPlanta}
techmob.planta.intervalo-ms=${PLANTA_INTERVALO_MS:1000}
techmob.planta.timeout-ms=${PLANTA_TIMEOUT_MS:2000}
# Sem leitura boa por mais que isso, o pedido aberto vira INTERROMPIDO
techmob.planta.segundos-sem-conexao=${PLANTA_SEGUNDOS_SEM_CONEXAO:10}
# Textos de status das estações. Só AGUARDANDO está confirmado: conferir
# com o resumo da primeira gravação real (coletor_planta.py).
techmob.planta.status-parado=${PLANTA_STATUS_PARADO:AGUARDANDO}
techmob.planta.status-parada=${PLANTA_STATUS_PARADA:PARADO}
# Meta de OEE em % (provisório)
techmob.planta.meta-oee=${META_OEE:75}
# Tempo padrão de cada estação, em segundos. PROVISÓRIO até a cronometragem:
# os mesmos de data/ciclo_padrao.json; a soma vai no seed do schema.sql.
techmob.planta.tempo-padrao-s.estoque=${TEMPO_PADRAO_ESTOQUE_S:20}
techmob.planta.tempo-padrao-s.manipulacao=${TEMPO_PADRAO_MANIPULACAO_S:35}
techmob.planta.tempo-padrao-s.separacao=${TEMPO_PADRAO_SEPARACAO_S:25}
