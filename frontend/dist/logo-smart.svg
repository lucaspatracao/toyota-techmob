<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo base -->
  <circle cx="50" cy="50" r="48" fill="url(#logoGrad)" opacity="0.1" stroke="url(#logoGrad)" stroke-width="2"/>
  
  <!-- Engrenagem principal (centro) -->
  <g transform="translate(50, 50)">
    <!-- Engrenagem externa -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#4F46E5" stroke-width="2.5"/>
    
    <!-- Dentes da engrenagem -->
    <g stroke="#4F46E5" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-25" x2="0" y2="-30"/>
      <line x1="17.7" y1="-17.7" x2="21.2" y2="-21.2"/>
      <line x1="25" y1="0" x2="30" y2="0"/>
      <line x1="17.7" y1="17.7" x2="21.2" y2="21.2"/>
      <line x1="0" y1="25" x2="0" y2="30"/>
      <line x1="-17.7" y1="17.7" x2="-21.2" y2="21.2"/>
      <line x1="-25" y1="0" x2="-30" y2="0"/>
      <line x1="-17.7" y1="-17.7" x2="-21.2" y2="-21.2"/>
    </g>
    
    <!-- Centro circular -->
    <circle cx="0" cy="0" r="8" fill="#4F46E5"/>
    <circle cx="0" cy="0" r="5" fill="#7C3AED"/>
  </g>
  
  <!-- Indicador de status (sinal de qualidade) -->
  <g transform="translate(70, 30)">
    <path d="M 0 8 L 4 4 L 8 0" fill="none" stroke="#7C3AED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>
