version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: techmob_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: techmob_oee
      POSTGRES_USER: techmob
      POSTGRES_PASSWORD: techmob123
    ports:
      - "5432:5432"
    volumes:
      - techmob_pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techmob -d techmob_oee"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opcional: interface web para inspecionar o banco durante o desenvolvimento
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: techmob_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@techmob.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  techmob_pgdata:
